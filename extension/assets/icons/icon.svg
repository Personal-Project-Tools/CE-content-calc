<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#181c2b" />
    </linearGradient>

    <!-- TikTok Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="0" stdDeviation="2" flood-color="#25F4EE" flood-opacity="0.6"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="0" stdDeviation="2" flood-color="#FE2C55" flood-opacity="0.6"/>
    </filter>
    
    <!-- Gradients for bars -->
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="pinkBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FE2C55" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with border -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#2b324b" stroke-width="2" />

  <!-- Metric / Analytics Growth Bars -->
  <!-- Bar 1: Cyan (Left, low) -->
  <rect x="28" y="66" width="18" height="34" rx="4" fill="url(#cyanBar)" filter="url(#cyanGlow)" />

  <!-- Bar 2: Center (Medium, Clean White/Ice) -->
  <rect x="55" y="48" width="18" height="52" rx="4" fill="#f8fafc" opacity="0.95" />

  <!-- Bar 3: Pink (Right, high) -->
  <rect x="82" y="28" width="18" height="72" rx="4" fill="url(#pinkBar)" filter="url(#pinkGlow)" />

  <!-- Trending Analytics Sparkle on top of highest bar -->
  <circle cx="91" cy="18" r="4.5" fill="#FE2C55" filter="url(#pinkGlow)" />
  <circle cx="91" cy="18" r="2" fill="#ffffff" />
</svg>
